<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src https://jmnuzfrtpinwaeylxrbp.supabase.co wss://jmnuzfrtpinwaeylxrbp.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Spencheck Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%238B9BFF'/><stop offset='1' stop-color='%232C5CE0'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/><text x='32' y='44' font-family='Arial' font-weight='800' font-size='34' text-anchor='middle' fill='white'>S</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>

  <!-- Signed out -->
  <div class="auth-screen" id="authScreen" hidden>
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo logo-lg">S</div>
        <h1>Spencheck Admin</h1>
        <p>Sign in with your admin account</p>
      </div>
      <form id="signInForm" autocomplete="on">
        <div class="field">
          <label for="signInEmail">Email</label>
          <input class="input" type="email" id="signInEmail" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="signInPassword">Password</label>
          <div class="password-wrap">
            <input class="input" type="password" id="signInPassword" autocomplete="current-password" required>
            <button type="button" id="togglePassword">Show</button>
          </div>
        </div>
        <p class="auth-error" id="authError"></p>
        <button class="btn btn-primary btn-block" type="submit" id="signInBtn">Sign in</button>
      </form>
      <p class="auth-note">Admins only. Every action is checked on the server.</p>
    </div>
  </div>

  <!-- Signed in -->
  <div class="layout" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">S</div>
        <div>
          <div class="brand-name">Spencheck</div>
          <div class="brand-sub">Admin console</div>
        </div>
      </div>
      <div class="me-card">
        <div class="me-avatar" id="meAvatar">A</div>
        <div style="min-width:0">
          <div class="me-name" id="meName">—</div>
          <div class="me-role">Administrator</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <button class="btn btn-outline btn-block show-sm" id="signOutBtnNav" style="margin-top:12px">Sign out</button>
      <div class="sidebar-foot"><span class="dot"></span>Supabase · live data</div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle"></p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh"></button>
          <button class="icon-btn" id="themeBtn" title="Light / dark" aria-label="Switch theme"></button>
          <button class="btn btn-outline btn-sm hide-sm" id="signOutBtn">Sign out</button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
